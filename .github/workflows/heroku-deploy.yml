name: Deploy to Heroku (container)
on:
  push:
    branches:
      - backend
      - frontend
  workflow_dispatch:

concurrency:
  group: heroku-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  HEROKU_EMAIL: _        # underscore for container registry login
  HEROKU_REGISTRY: registry.heroku.com

jobs:
  deploy-api:
    name: Deploy Areapass API (web)
    runs-on: ubuntu-latest
    env:
      HEROKU_APP: areapass-api
      PROCESS_TYPE: web
      DOCKERFILE: backend/Dockerfile
      CONTEXT: backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Login to Heroku Container Registry
        run: echo "${{ secrets.HEROKU_API_KEY }}" | docker login --username=${HEROKU_EMAIL} --password-stdin $HEROKU_REGISTRY

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.CONTEXT }}
          file: ./${{ env.DOCKERFILE }}
          push: true
          tags: ${{ env.HEROKU_REGISTRY }}/${{ env.HEROKU_APP }}/${{ env.PROCESS_TYPE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false

      - name: Release on Heroku
        run: heroku container:release $PROCESS_TYPE -a $HEROKU_APP
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

  deploy-web:
    name: Deploy Areapass (web)
    runs-on: ubuntu-latest
    needs: [deploy-api]
    env:
      HEROKU_APP: areapass
      PROCESS_TYPE: web
      DOCKERFILE: frontend/Dockerfile.ssr
      CONTEXT: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Login to Heroku Container Registry
        run: echo "${{ secrets.HEROKU_API_KEY }}" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.CONTEXT }}
          file: ./${{ env.DOCKERFILE }}
          push: true
          tags: ${{ env.HEROKU_REGISTRY }}/${{ env.HEROKU_APP }}/${{ env.PROCESS_TYPE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false

      - name: Release on Heroku
        run: heroku container:release $PROCESS_TYPE -a $HEROKU_APP
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}


[supervisord]
nodaemon=true             ; stay in foreground (useful for containers)
logfile=/var/log/supervisord.log

[program:ssh_tunnel]
command=/usr/bin/autossh -M 0 -N -L 15432:$SSH_REMOTE_HOST:5432 $SSH_TUNNEL_USER@$SSH_TUNNEL_HOST -i $SSH_TUNNEL_PEM
autostart=true
autorestart=true
startretries=999
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
environment=SSH_REMOTE_HOST="%{SSH_REMOTE_HOST}",SSH_TUNNEL_USER="%{SSH_TUNNEL_USER}",SSH_TUNNEL_PEM="%{SSH_TUNNEL_PEM}"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
redirect_stderr=true
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
redirect_stderr=true
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0


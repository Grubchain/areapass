[supervisord]
nodaemon=true             ; stay in foreground (useful for containers)
logfile=/var/log/supervisord.log

[program:ssh_tunnel]
command=/bin/bash -lc '
  set -e
  echo "[supervisor] Initializing SSH tunnel..."

  # --- Prepare directories ---
  mkdir -p /etc/keys ~/.ssh
  chmod 700 /etc/keys ~/.ssh

  # --- Write the private key from env (if provided as SSH_TUNNEL_KEY) ---
  if [ -n "$SSH_TUNNEL_PEM" ]; then
    printf "%%s" "$SSH_TUNNEL_PEM" > /etc/keys/heroku_tunnel.key
    chmod 600 /etc/keys/heroku_tunnel.key
    cat /etc/keys/heroku_tunnel.key
  fi

  # --- Automatically add EC2 host key ---
  echo "[supervisor] Fetching host key for $SSH_TUNNEL_HOST..."
  ssh-keyscan -t ed25519 "$SSH_TUNNEL_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  chmod 600 ~/.ssh/known_hosts

  # --- Start tunnel ---
  echo "[supervisor] Starting autossh tunnel to $SSH_TUNNEL_HOST..."
  /usr/bin/autossh -M 0 -N \
  -L "127.0.0.1:15432:${SSH_REMOTE_HOST}:5432" \
  -p 22 \
  -i "${SSH_TUNNEL_PEM}" \
  "${SSH_TUNNEL_USER}@${SSH_TUNNEL_HOST}"'
autostart=true
autorestart=true
startretries=999
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
priority=10
startsecs=2
environment=SSH_REMOTE_HOST="%(ENV_SSH_REMOTE_HOST)s",SSH_TUNNEL_USER="%(ENV_SSH_TUNNEL_USER)s",SSH_TUNNEL_PEM="%(ENV_SSH_TUNNEL_PEM)s"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
redirect_stderr=true
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
priority=20

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
redirect_stderr=true
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
priority=15


[supervisord]
nodaemon=true             ; stay in foreground (useful for containers)
logfile=/var/log/supervisord.log
exitwhenempty=true

[program:ssh_tunnel]
command=/bin/bash -lc '
  set -e
  echo "[supervisor] Initializing SSH tunnel..."

  export PGPASSWORD="$DB_PASSWORD"

  # --- Prepare directories ---
  mkdir -p /etc/keys ~/.ssh
  chmod 700 /etc/keys ~/.ssh

  # --- Write the private key from env (if provided as SSH_TUNNEL_KEY) ---
  if [ -n "$SSH_TUNNEL_PEM" ]; then
    printf "%%s" "$SSH_TUNNEL_PEM" > /etc/keys/heroku_tunnel.key
    chmod 600 /etc/keys/heroku_tunnel.key
    cat /etc/keys/heroku_tunnel.key
  fi

  # --- Automatically add EC2 host key ---
  echo "[supervisor] Fetching host key for $SSH_TUNNEL_HOST..."
  ssh-keyscan -t ed25519 "$SSH_TUNNEL_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  chmod 600 ~/.ssh/known_hosts

  # --- Start tunnel ---
  echo "[supervisor] Starting autossh tunnel to $SSH_TUNNEL_HOST..."
  /usr/bin/autossh -M 0 -N \
  -L "127.0.0.1:15432:${SSH_REMOTE_HOST}:5432" \
  -p 22 \
  -i "${SSH_TUNNEL_PEM}" \
  "${SSH_TUNNEL_USER}@${SSH_TUNNEL_HOST}"

    echo "[supervisor] Tunnel established. Waiting 5s for stability..."
  sleep 5

  # --- Create database if not exists ---
  echo "[supervisor] Checking and creating DB if missing..."

  if PGSSLMODE=require psql -h 127.0.0.1 -p 15432 -U "$DB_USERNAME" -d postgres -tc \
     "SELECT 1 FROM pg_database WHERE datname='\''$DB_DATABASE'\''" | grep -q 1; then
    echo "[supervisor] Database '$DB_DATABASE' already exists."
  else
    echo "[supervisor] Creating database '$DB_DATABASE'..."
    PGSSLMODE=require psql -h 127.0.0.1 -p 15432 -U "$DB_USERNAME" -d postgres -c \
      "CREATE DATABASE \"$DB_DATABASE\" WITH OWNER \"$DB_USERNAME\" ENCODING '\''UTF8'\'' TEMPLATE template0;"
    echo "************************************"
    echo "[supervisor] Database created successfully."
    echo "************************************"
  fi

  echo "[supervisor] Database check complete."
  '
autostart=true
autorestart=true
startretries=999
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
startsecs=2
environment=DB_PASSWORD="%(ENV_DB_PASSWORD)s",DB_DATABASE="%(ENV_DB_DATABASE)s",DB_USERNAME="%(ENV_DB_USERNAME)s",SSH_REMOTE_HOST="%(ENV_SSH_REMOTE_HOST)s",SSH_TUNNEL_USER="%(ENV_SSH_TUNNEL_USER)s",SSH_TUNNEL_PEM="%(ENV_SSH_TUNNEL_PEM)s"

[program:laravel_migrations]
command=/bin/bash -lc '
  echo "[supervisor] Waiting for tunnel..."

  for i in {1..10}; do nc -z 127.0.0.1 15432 && break; sleep 3; done

  if ! php artisan migrate --force; then
    echo "============================================"
    echo "ERROR: Migrations could not complete. Check the error above."
    echo "Ensure DATABASE_URL is set."
    echo "============================================"
  fi'
startsecs=30
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
redirect_stderr=true
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
priority=15
autorestart=false
startretries=3
startsecs=10

